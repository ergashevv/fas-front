<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/x-icon" href="https://faskids.shop/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://faskids.shop/images/logos/logo.PNG" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://faskids.shop/images/logos/logo.PNG" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://faskids.shop/images/logos/logo.PNG" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Indexing -->
    <meta name="robots" content="index,follow" />

    <!-- Primary SEO -->
    <title>FAS Kids — Bolalar kiyimlari | Sifatli, xavfsiz, hamyonbop</title>
    <meta
      name="description"
      content="Bolalar uchun quvonchli, qulay va zamonaviy kiyimlar yaratamiz. Sifatli materiallar, xavfsiz dizaynlar va hamyonbop narxlar. FAS Kids — bolalar yaxshi ko'radigan va ota-onalar ishonch bildiradiganlar."
    />
    <link rel="canonical" href="https://faskids.shop/" />

    <!-- Theme color (mobil brauzerlar uchun) -->
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Open Graph (Facebook/Telegram/LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FAS Kids" />
    <meta property="og:title" content="FAS Kids — Bolalar kiyimlari" />
    <meta property="og:description" content="Bolalar uchun quvonchli, qulay va zamonaviy kiyimlar. Sifatli materiallar, xavfsiz dizaynlar va hamyonbop narxlar." />
    <meta property="og:url" content="https://faskids.shop/" />
    <meta property="og:image" content="https://faskids.shop/images/logos/logo.PNG" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="FAS Kids logotipi" />
    <meta property="og:locale" content="uz_UZ" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FAS Kids — Bolalar kiyimlari" />
    <meta name="twitter:description" content="Bolalar uchun quvonchli, qulay va zamonaviy kiyimlar. Sifatli materiallar, xavfsiz dizaynlar va hamyonbop narxlar." />
    <meta name="twitter:image" content="https://faskids.shop/images/logos/logo.PNG" />

    <!-- Structured Data (Organization + Website) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "url": "https://faskids.shop/",
        "name": "FAS Kids",
        "logo": "https://faskids.shop/images/logos/logo.PNG",
        "description": "Bolalar uchun quvonchli, qulay va zamonaviy kiyimlar yaratamiz. Sifatli materiallar, xavfsiz dizaynlar va hamyonbop narxlar.",
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://faskids.shop/",
        "name": "FAS Kids",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://faskids.shop/search?q={query}",
          "query-input": "required name=query"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Sizning kirish faylingiz: -->
    <script type="module" src="/client/App.tsx"></script>
